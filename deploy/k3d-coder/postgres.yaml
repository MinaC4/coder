apiVersion: v1
kind: Service
metadata:
  name: coder-postgres
  namespace: coder
  labels:
    app.kubernetes.io/name: coder-postgres
    app.kubernetes.io/part-of: coder
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: coder-postgres
    app.kubernetes.io/part-of: coder
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: coder-postgres
  namespace: coder
  labels:
    app.kubernetes.io/name: coder-postgres
    app.kubernetes.io/part-of: coder
spec:
  serviceName: coder-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coder-postgres
      app.kubernetes.io/part-of: coder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coder-postgres
        app.kubernetes.io/part-of: coder
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:17.11-alpine3.24
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: coder
            - name: POSTGRES_USER
              value: coder
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coder-db-url
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            exec:
              command: [pg_isready, -U, coder, -d, coder]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [pg_isready, -U, coder, -d, coder]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, coder, -d, coder]
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: coder-postgres
          app.kubernetes.io/part-of: coder
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 8Gi
