coder:
  image:
    repo: coder
    tag: local
    pullPolicy: Never
  replicaCount: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  env:
    - name: CODER_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef:
          name: coder-db-url
          key: url
    - name: CODER_ACCESS_URL
      value: http://coder.192.168.1.3.nip.io:18080
    - name: CODER_WILDCARD_ACCESS_URL
      value: "*.coder.192.168.1.3.nip.io"
    - name: CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE
      value: "false"
  serviceAccount:
    workspacePerms: false
    enableDeployments: false
    workspaceNamespaces:
      - name: coder-workspaces
        workspacePerms: true
        enableDeployments: true
  service:
    type: ClusterIP
  httproute:
    enable: true
    parentRefs:
      - name: gateway-default
        namespace: openchoreo-control-plane
        sectionName: http
    host: coder.192.168.1.3.nip.io
    wildcardHost: "*.coder.192.168.1.3.nip.io"
    templateBuilderTimeout: 180s
