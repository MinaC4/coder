apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coder-postgres-backups
  namespace: coder
  labels:
    app.kubernetes.io/name: coder-postgres
    app.kubernetes.io/part-of: coder
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: coder-postgres-backup
  namespace: coder
  labels:
    app.kubernetes.io/name: coder-postgres
    app.kubernetes.io/part-of: coder
spec:
  schedule: "15 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: coder-postgres-backup
            app.kubernetes.io/part-of: coder
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:17.11-alpine3.24
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
                - |
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  pg_dump --format=custom --no-owner --no-acl "$CODER_PG_CONNECTION_URL" > "/backups/coder-${timestamp}.dump"
                  find /backups -type f -name 'coder-*.dump' -mtime +14 -delete
              env:
                - name: CODER_PG_CONNECTION_URL
                  valueFrom:
                    secretKeyRef:
                      name: coder-db-url
                      key: url
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: coder-postgres-backups
